name: Feature Request
description: Suggest an idea, improvement, or new capability for this project
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature! Please fill out the sections below to help us understand the problem and your proposed solution.

  - type: checkboxes
    id: pre-flight
    attributes:
      label: Pre-flight Checklist
      description: Please confirm you have checked the following before submitting.
      options:
        - label: I have searched existing issues and discussions to ensure this feature hasn't already been requested.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the pain point or limitation you are experiencing.
      placeholder: e.g., I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: Explain how you envision this feature working from a user's perspective.
      placeholder: e.g., Add a new configuration option that allows...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Have you found any workarounds or alternative tools that partially solve this?
      placeholder: e.g., Currently, I have to manually run a script to...
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Impact / Priority
      description: How critical is this feature to your workflow?
      options:
        - Nice to have (Minor convenience)
        - Important (Improves daily workflow)
        - Blocker (Cannot adopt/use the project without this)
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context or mockups
      description: Add any screenshots, links, code snippets, or examples that help illustrate your idea.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a Pull Request to implement this feature.
          required: false
